interface:
  display_name: "1html-artifact"
  short_description: "Простой HTML-артефакт из ответа"
  default_prompt: "Используй $1html-artifact ТОЛЬКО по явному ручному вызову пользователя — это сигнал, что он не понял предыдущий ответ (термины, сложный язык, прыгающая мысль). Перепиши последний ответ или указанную тему в простой понятный HTML-файл в _workspace/HTML_artifacts/: без жаргона, с контекстом, главным выводом в начале. Если процесс, роли, развилка, статусы, доли или путь решения яснее схемой, добавь Mermaid через общий toolkit. Не запускай автоматически."

policy:
  allow_implicit_invocation: false
