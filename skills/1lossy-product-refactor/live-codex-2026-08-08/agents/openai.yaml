interface:
  display_name: "1-Lossy product refactor"
  short_description: "Пересборка разросшегося управляющего текста с осознанными потерями"
  default_prompt: "Используй $1lossy-product-refactor, когда управляющий текст просят сократить: карта целей от оригинала, цели схлопни вверх, процедуры — в известные имена, телеграфный стиль; ход рефактора пиши в чат, сдача — текст + объяснение, почему цели подразумевают процедуры оригинала."

policy:
  allow_implicit_invocation: true
