interface:
  display_name: "1-Планирование"
  short_description: "Перечитываемый anchor для Wayfinding и Execution"
  default_prompt: "Используй $1planning для одного durable steering contract: отдели evidence-state от planning consequence, clean re-anchor-ись при invalidation, выбирай Wayfinding Next через Decision Fork, допускай Execution только после First-Action Probe и оставляй method на lowest sufficient fidelity; в native Plan mode не меняй filesystem."

policy:
  allow_implicit_invocation: true
