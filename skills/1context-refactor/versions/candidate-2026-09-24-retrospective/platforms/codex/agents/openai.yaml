interface:
  display_name: "1context-refactor"
  short_description: "Use when reviewing a session or noticing wasted tool calls, rework, needless stops, or excessive verification."
  default_prompt: "Используй $1context-refactor: разбери переписку и действия за всю доступную сессию, найди существенные лишние действия и неэффективности, выясни причины и сохрани полезные улучшения в пределах полномочий. Затем продолжи оставшуюся разрешённую работу."

policy:
  allow_implicit_invocation: true
