interface:
  display_name: "1-Память чата"
  short_description: "Recover the owner's intent from their words."
  default_prompt: "Используй $1chat-recall, чтобы сохранить важные слова владельца или восстановить из его прежних слов его намерения, отношение и применимую позицию для текущей работы."

policy:
  allow_implicit_invocation: true
