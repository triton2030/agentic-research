<!doctype html>
<html lang="ru" data-theme="bumblebee">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="generated-at" content="__CATALOG_GENERATED_AT__">
  <title>Локальные HTML-артефакты</title>
  <link href="lib/daisyui.css" rel="stylesheet">
  <link href="lib/daisyui-themes.css" rel="stylesheet">
  <link href="assets/shared/catalog.css" rel="stylesheet">
  <script src="lib/tailwind.js"></script>
  <script>
    document.addEventListener("alpine:init", () => {
      Alpine.data("artifactCatalog", (items) => ({
        items,
        activeTags: [],
        sortBy: "newest",
        favoriteSlugs: [],
        copiedSlug: "",
        copyResetTimer: null,
        favoritesStorageKey:
          `1html-catalog-favorites-v1:${window.location.pathname}`,
        relativeFormatter: new Intl.RelativeTimeFormat("ru", { numeric: "auto" }),

        init() {
          try {
            const stored = JSON.parse(
              localStorage.getItem(this.favoritesStorageKey) || "[]"
            );
            const available = new Set(this.items.map((item) => item.slug));
            this.favoriteSlugs = Array.isArray(stored)
              ? stored.filter(
                  (slug) => typeof slug === "string" && available.has(slug)
                )
              : [];
          } catch {
            this.favoriteSlugs = [];
          }
        },

        get allTags() {
          return [...new Set(this.items.flatMap((item) => item.tags))]
            .sort((left, right) => left.localeCompare(right, "ru"));
        },

        get visibleItems() {
          const selected = this.activeTags;
          const result = this.items.filter((item) =>
            selected.every((tag) => item.tags.includes(tag))
          );

          return result.sort((left, right) => {
            const favoriteOrder =
              Number(this.isFavorite(right.slug)) -
              Number(this.isFavorite(left.slug));
            if (favoriteOrder) return favoriteOrder;
            if (this.sortBy === "oldest") return left.created_epoch - right.created_epoch;
            if (this.sortBy === "title") return left.title.localeCompare(right.title, "ru");
            if (this.sortBy === "tag") {
              const tagOrder = (left.tags[0] || "").localeCompare(right.tags[0] || "", "ru");
              return tagOrder || left.title.localeCompare(right.title, "ru");
            }
            return right.created_epoch - left.created_epoch;
          });
        },

        toggleTag(tag) {
          this.activeTags = this.activeTags.includes(tag)
            ? this.activeTags.filter((value) => value !== tag)
            : [...this.activeTags, tag];
        },

        isFavorite(slug) {
          return this.favoriteSlugs.includes(slug);
        },

        toggleFavorite(slug) {
          this.favoriteSlugs = this.isFavorite(slug)
            ? this.favoriteSlugs.filter((value) => value !== slug)
            : [...this.favoriteSlugs, slug];

          try {
            localStorage.setItem(
              this.favoritesStorageKey,
              JSON.stringify(this.favoriteSlugs)
            );
          } catch {
            // The catalog still works when file:// storage is unavailable.
          }
        },

        projectUrl(item) {
          return new URL(item.href, window.location.href).href;
        },

        copyTextFallback(value) {
          const textarea = document.createElement("textarea");
          textarea.value = value;
          textarea.setAttribute("readonly", "");
          textarea.style.position = "fixed";
          textarea.style.opacity = "0";
          document.body.appendChild(textarea);
          textarea.select();
          const copied = document.execCommand("copy");
          textarea.remove();
          if (!copied) throw new Error("Copy command failed");
        },

        async copyProjectLink(item) {
          const fullUrl = this.projectUrl(item);

          try {
            if (!navigator.clipboard?.writeText) {
              throw new Error("Clipboard API unavailable");
            }
            await navigator.clipboard.writeText(fullUrl);
          } catch {
            try {
              this.copyTextFallback(fullUrl);
            } catch {
              window.prompt("Скопируйте полную ссылку", fullUrl);
              return;
            }
          }

          this.copiedSlug = item.slug;
          window.clearTimeout(this.copyResetTimer);
          this.copyResetTimer = window.setTimeout(() => {
            if (this.copiedSlug === item.slug) this.copiedSlug = "";
          }, 1600);
        },

        relativeTime(epoch) {
          const difference = epoch - Date.now() / 1000;
          const units = [
            ["year", 31536000],
            ["month", 2592000],
            ["week", 604800],
            ["day", 86400],
            ["hour", 3600],
            ["minute", 60],
            ["second", 1],
          ];
          const [unit, seconds] =
            units.find(([, size]) => Math.abs(difference) >= size) || units.at(-1);
          return this.relativeFormatter.format(Math.round(difference / seconds), unit);
        },

        pageLabel(count) {
          const lastTwo = count % 100;
          const last = count % 10;
          if (lastTwo >= 11 && lastTwo <= 14) return `${count} страниц`;
          if (last === 1) return `${count} страница`;
          if (last >= 2 && last <= 4) return `${count} страницы`;
          return `${count} страниц`;
        },
      }));
    });
  </script>
  <script defer src="lib/alpine.js"></script>
</head>
<body class="catalog-page" x-data='artifactCatalog(__CATALOG_PROJECT_PAYLOAD__)'>
  <header class="catalog-topbar">
    <a class="catalog-brand" href="index.html">HTML artifacts</a>
    <span class="catalog-topbar-note">_workspace / HTML_artifacts</span>
    <span class="badge badge-outline">__CATALOG_PROJECT_COUNT__</span>
  </header>

  <main class="catalog-shell">
    <section class="catalog-hero">
      <p class="catalog-kicker">Local artifact gallery</p>
      <h1 class="catalog-title">Галерея</h1>
      <div class="catalog-hero-meta">
        <span class="catalog-count">__CATALOG_PROJECT_COUNT__</span>
        <span class="catalog-count-label">__CATALOG_PROJECTS_LABEL__<br>в одной папке</span>
      </div>
    </section>

    <section class="catalog-controls" x-cloak x-show="items.length">
      <div class="catalog-tag-filter" aria-label="Фильтр по тегам">
        <button
          class="btn btn-sm"
          :class="activeTags.length === 0 ? 'btn-neutral' : 'btn-ghost'"
          @click="activeTags = []"
        >Все</button>
        <template x-for="tag in allTags" :key="tag">
          <button
            class="btn btn-sm"
            :class="activeTags.includes(tag) ? 'btn-primary' : 'btn-ghost'"
            @click="toggleTag(tag)"
            x-text="tag"
          ></button>
        </template>
      </div>

      <label class="catalog-sort">
        <span>Сортировка</span>
        <select class="select select-sm" x-model="sortBy">
          <option value="newest">Сначала новые</option>
          <option value="oldest">Сначала старые</option>
          <option value="title">По названию</option>
          <option value="tag">По первому тегу</option>
        </select>
      </label>
    </section>

    <article class="card border border-base-300 bg-base-200 catalog-empty" x-cloak x-show="items.length === 0">
      <div class="card-body">
        <h2 class="card-title">Пока нет страниц</h2>
        <p>Первый созданный HTML автоматически появится здесь.</p>
      </div>
    </article>

    <article class="card border border-base-300 bg-base-200 catalog-empty" x-cloak x-show="items.length && visibleItems.length === 0">
      <div class="card-body">
        <h2 class="card-title">Нет страниц с таким набором тегов</h2>
        <button class="btn btn-sm btn-neutral w-fit" @click="activeTags = []">
          Сбросить фильтр
        </button>
      </div>
    </article>

    <div
      class="catalog-grid"
      x-cloak
      x-show="visibleItems.length"
      x-effect="visibleItems; copiedSlug; favoriteSlugs;
        $nextTick(() => window.lucide?.createIcons())"
    >
      <template x-for="(item, index) in visibleItems" :key="item.slug">
        <article
          class="catalog-card"
          :class="{
            'catalog-card--lead': index === 0,
            'catalog-card--wide': index === 3,
            'catalog-card--fav': isFavorite(item.slug)
          }"
          :style="`--reveal-order:${Math.min(index, 11)}`"
        >
          <a class="catalog-card-link" :href="item.href">
            <span class="catalog-card-watermark" x-show="item.icon" aria-hidden="true">
              <i :data-lucide="item.icon"></i>
            </span>
            <span class="catalog-card-path" x-text="item.href"></span>
            <h2 class="catalog-card-title" x-text="item.title"></h2>
          </a>

          <div class="catalog-card-foot">
            <div class="catalog-card-tags">
              <template x-for="tag in item.tags" :key="tag">
                <button class="badge badge-outline" @click="toggleTag(tag)" x-text="tag"></button>
              </template>
              <span class="catalog-no-tags" x-show="item.tags.length === 0">без тегов</span>
            </div>

            <div class="catalog-card-meta">
              <span x-text="relativeTime(item.created_epoch)"></span>
              <span x-show="item.page_count > 1" x-text="pageLabel(item.page_count)"></span>
            </div>
          </div>

          <div class="catalog-actions">
            <button
              class="btn btn-circle btn-sm catalog-favorite"
              :class="isFavorite(item.slug) ? 'btn-primary' : 'btn-ghost'"
              @click="toggleFavorite(item.slug)"
              :aria-label="isFavorite(item.slug)
                ? `Убрать ${item.title} из избранного`
                : `Добавить ${item.title} в избранное`"
              :aria-pressed="isFavorite(item.slug)"
              :title="isFavorite(item.slug) ? 'Убрать из избранного' : 'В избранное'"
            >
              <i data-lucide="star" class="size-4" aria-hidden="true"></i>
            </button>
            <button
              class="btn btn-circle btn-sm btn-ghost"
              @click="copyProjectLink(item)"
              :aria-label="copiedSlug === item.slug
                ? `Ссылка на ${item.title} скопирована`
                : `Скопировать полную ссылку на ${item.title}`"
              :title="copiedSlug === item.slug ? 'Скопировано' : 'Копировать ссылку'"
            >
              <template x-if="copiedSlug !== item.slug">
                <i data-lucide="copy" class="size-4" aria-hidden="true"></i>
              </template>
              <template x-if="copiedSlug === item.slug">
                <i data-lucide="check" class="size-4" aria-hidden="true"></i>
              </template>
            </button>
          </div>
        </article>
      </template>
    </div>
  </main>

  <script src="lib/lucide.min.js"></script>
</body>
</html>
