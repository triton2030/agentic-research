interface:
  display_name: "1-Находки без отвлечения"
  short_description: "Сохраняет проблемы на потом, не прерывая работу"
  default_prompt: >
    Если по ходу работы что-то не нравится или замечена проблема на потом,
    вызови $1findings, сохрани одну короткую строку и продолжи прерванное
    действие.

policy:
  allow_implicit_invocation: true
