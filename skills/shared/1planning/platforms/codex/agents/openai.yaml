interface:
  display_name: "1-Планирование"
  short_description: "Challenge the task, then prove a stepwise decomposition in chat before any plan files"
  default_prompt: "Use $1planning at any thought about what to do next or at owner words like 'давай запланируем' — and before reacting to a large error (read the plans first: it may be deferred work, not breakage): read the project's root instructions and the skills governing the task's domain, argue whether the task should start at all and why it beats the queue, decompose stepwise in chat by named book methods (each method point cites the plan element it changed; axis-cut, never chronology; honest Wayfinding/Execution mode), close the grounds via 1use-principles and 1interview-tool, get the owner's yes before any plan files, then route: epic map → $1plan-map, task file → $1plan-task, and keep epics and tasks fresh."

policy:
  allow_implicit_invocation: true
