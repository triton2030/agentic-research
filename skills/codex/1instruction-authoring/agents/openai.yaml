interface:
  display_name: "1-Создание инструкций"
  short_description: "Create project instructions: a root router, folder instructions, or a new rule"
  default_prompt: "Use $1instruction-authoring when project instructions are created. Understand what the project is trying to achieve, then how it achieves it and where things live; build the root as a router of at most twenty knowledge units with links into folder instructions; chain folder instructions so each names its neighbours along real work; write non-skill surfaces only after the owner approves."

policy:
  allow_implicit_invocation: true
