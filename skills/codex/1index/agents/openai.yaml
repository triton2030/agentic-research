interface:
  display_name: "1-Индекс маршрутов"
  short_description: "Record search-paid routes to buried knowledge in INDEX.md"
  default_prompt: "Use $1index to create or update INDEX.md — a map of routes paid for by past searches: intent → file#section → what to learn there. Only search-paid entries, no file trees, no second truth; folder INDEX only next to a folder instruction; verify with five representative intents."

policy:
  allow_implicit_invocation: true
