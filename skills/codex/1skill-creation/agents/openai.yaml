interface:
  display_name: "1-Создание скиллов"
  short_description: "Create a new skill: extract the user's intended function, then write the shortest unambiguous skill"
  default_prompt: "Use $1skill-creation when the user wants a new skill created. First ask the user what function and protocol they mean by the skill's name; then write the shortest skill an agent cannot misread, adding lines only from the user's words or agent-management science; verify the draft with a clean-window subagent."

policy:
  allow_implicit_invocation: true
