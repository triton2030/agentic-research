interface:
  display_name: "1expert-lens"
  short_description: "Взгляд эксперта с высоты против стажёрских ошибок"
  default_prompt: "Используй $1expert-lens перед работой и на развилках: вызови мудрость релевантного к ситуации эксперта — типовая стажёрская ошибка → критерий или провал → evidence, отличающее успех от имитации; материальность задаёт цена ошибки, outcome у владельца."

policy:
  allow_implicit_invocation: true
