# Per-project baseline filters for md-tools (md status / md search / md
# audit / md health / md check / ...). CLI --path-include /
# --path-exclude APPEND onto these. Built-in skip (.git, .md-navigator,
# _archive, runs, node_modules, ...) is non-configurable.

[index]
# Canonical knowledge corpus for semantic index/search/audit.
# Code, runtime experiments, plans and scratch docs stay outside retrieval.
include = ["knowledge/**"]

[graph]
# Same: transcript logs are not part of the documentation graph; including
# them in `md health` / `md check` / `md scan` only inflates broken-link
# and missing-frontmatter findings.
exclude = ["experiments/all-my-messages/*"]
