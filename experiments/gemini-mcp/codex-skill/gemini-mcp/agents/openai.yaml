interface:
  display_name: "Gemini MCP"
  short_description: "Use Gemini MCP through Antigravity CLI"
  default_prompt: >
    Use $gemini-mcp only when Gemini is a controlled peer: second opinion,
    audit, web/file research, Gemini 3.5 Flash via Antigravity CLI, or
    comparison with Claude. Start with gemini_status, then gemini_ask for short
    calls. Use gemini_run plus observe/peek/wait/result/kill for Antigravity or
    legacy Gemini CLI observable runs; useTmux only when such a run must survive
    MCP churn. For Antigravity read-only review, leave approvalMode unset. For
    explicitly approved writes, pass approvalMode yolo and absolute
    cwd/includeDirectories. Brief Gemini with role, lens, sources, criteria,
    evidence shape, and stop condition. Treat empty text, missing MCP tools, or
    non-terminal saved runs as surface failures to fix or report.

policy:
  allow_implicit_invocation: true
