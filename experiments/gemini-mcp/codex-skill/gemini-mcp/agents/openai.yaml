interface:
  display_name: "Gemini MCP"
  short_description: "Run controlled Gemini External Peer Reviews"
  default_prompt: >
    Use $gemini-mcp only when Gemini should run as a controlled External Peer
    Review agent through account-backed Antigravity/Gemini CLI: second opinion,
    bug hunt, architecture/instruction audit, web/file research, Gemini 3.5
    Flash review, or comparison with Claude. Start with gemini_status. For
    short calls use gemini_ask; for observable work use gemini_run plus
    observe/peek/wait/result/kill. Default to read-only: leave approvalMode
    unset and pass absolute cwd/includeDirectories. For writes, require explicit
    user approval and approvalMode yolo with absolute allowed folders. Brief
    Gemini with role, lens, sources, criteria, evidence shape, and stop
    condition. Include agent_behavior, full relay file, warnings, backend/model,
    and tail status in closeout. Treat empty text, missing/closed MCP transport,
    or non-terminal saved runs as surface failures to fix or report; do not
    replace the external review with Codex.

policy:
  allow_implicit_invocation: true
