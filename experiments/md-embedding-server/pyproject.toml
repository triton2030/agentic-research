[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "md-tools"
version = "0.7.0"
description = "CLI surface for Markdown corpus navigation and graph hygiene tools."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "networkx>=3.2",
  "numpy>=1.26",
  "pymorphy3>=2.0",
  "pyyaml>=6",
  "scipy>=1.11",
  "sqlite-vec>=0.1.6",
]

[project.scripts]
md = "md_cli.main:main"

[dependency-groups]
dev = [
  "pytest>=8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/md_cli", "src/navigator"]

[tool.pytest.ini_options]
pythonpath = ["src"]
