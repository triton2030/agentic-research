{
  "server": {
    "host": "127.0.0.1",
    "port": 19331,
    "with_bot": false
  },
  "storage": {
    "workspace": "${OPENVIKING_PILOT_ROOT}/.runtime/openviking-data",
    "agfs": {
      "backend": "local"
    },
    "vectordb": {
      "backend": "local"
    }
  },
  "embedding": {
    "max_concurrent": 2,
    "dense": {
      "provider": "local",
      "model": "bge-small-zh-v1.5-f16",
      "dimension": 512,
      "input": "text",
      "cache_dir": "${OPENVIKING_PILOT_ROOT}/.runtime/model-cache"
    }
  },
  "vlm": {
    "provider": "openai-codex",
    "model": "gpt-5.4",
    "api_base": "https://chatgpt.com/backend-api/codex",
    "timeout": 600,
    "max_concurrent": 2
  },
  "bot": {
    "gateway": {
      "host": "127.0.0.1",
      "port": 18791
    }
  }
}
