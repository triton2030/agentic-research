<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TinyFlow Diagram Demo</title>
  <style>
    :root {
      --paper: #fff8ec;
      --ink: #26221b;
      --muted: #665d50;
      --teal: #3f7168;
      --gold: #c28a34;
      --rose: #9c6374;
      --panel: rgba(255, 255, 255, .72);
      --shadow: 0 24px 78px rgba(31, 27, 20, .16);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 16% 10%, rgba(246, 214, 146, .55), transparent 30%),
        radial-gradient(circle at 86% 16%, rgba(118, 176, 165, .42), transparent 31%),
        linear-gradient(135deg, #fffaf1 0%, #eef6f1 54%, #f8edf1 100%);
      padding: 22px;
    }

    .app {
      display: grid;
      grid-template-columns: minmax(280px, .82fr) minmax(360px, 1.18fr);
      gap: 16px;
      width: min(1180px, 100%);
      margin: 0 auto;
    }

    .panel {
      border: 1px solid rgba(74, 58, 33, .14);
      border-radius: 26px;
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
      overflow: hidden;
    }

    .left {
      display: grid;
      grid-template-rows: auto 1fr auto;
      min-height: 600px;
    }

    header {
      padding: 20px 20px 12px;
    }

    .eyebrow {
      display: inline-flex;
      width: fit-content;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(63, 113, 104, .12);
      color: var(--teal);
      font-size: 12px;
      font-weight: 850;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 12px 0 8px;
      font-size: 34px;
      line-height: 1;
      letter-spacing: 0;
    }

    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.5;
      font-size: 14px;
    }

    textarea {
      width: calc(100% - 40px);
      min-height: 330px;
      margin: 8px 20px 0;
      resize: vertical;
      border: 1px solid rgba(74, 58, 33, .16);
      border-radius: 18px;
      padding: 14px;
      color: #f9f3e7;
      background: #20262a;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.06);
      font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      padding: 14px 20px 20px;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 10px 14px;
      cursor: pointer;
      font: inherit;
      font-weight: 820;
      background: var(--teal);
      color: #fffaf1;
      box-shadow: 0 12px 28px rgba(63, 113, 104, .22);
    }

    button.secondary {
      color: var(--teal);
      background: #fffaf1;
      border: 1px solid rgba(63, 113, 104, .18);
      box-shadow: none;
    }

    .output {
      min-height: 600px;
      padding: 18px;
    }

    .error {
      padding: 16px;
      border-radius: 18px;
      background: #fde8dc;
      color: #5d2f20;
      border: 1px solid rgba(184, 101, 63, .28);
      font-weight: 760;
    }

    .tinyflow {
      margin: 0;
      padding: 18px;
      border-radius: 24px;
      background: rgba(255, 250, 241, .72);
      border: 1px solid rgba(74, 58, 33, .12);
      box-shadow: 0 18px 56px rgba(31, 27, 20, .12);
    }

    .tinyflow figcaption {
      margin: 0 0 10px;
      color: var(--ink);
      font-size: 20px;
      font-weight: 850;
    }

    .tinyflow svg {
      display: block;
      width: 100%;
      height: auto;
    }

    .tf-node {
      fill: var(--tf-fill);
      stroke: var(--tf-stroke);
      stroke-width: 2.2;
      filter: drop-shadow(0 12px 18px rgba(34, 28, 18, .12));
    }

    .tf-node-type {
      fill: var(--tf-stroke);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .tf-node-label {
      fill: var(--tf-text);
      font-size: 13px;
      font-weight: 760;
    }

    .tf-edge {
      fill: none;
      stroke: #54756f;
      stroke-width: 2.4;
    }

    .tf-edge-label-bg {
      fill: rgba(255, 250, 241, .88);
      stroke: rgba(84, 117, 111, .16);
    }

    .tf-edge-label {
      fill: #486e67;
      font-size: 11px;
      font-weight: 800;
    }

    .tinyflow-ink {
      background: #20262a;
    }

    .tinyflow-ink figcaption {
      color: #fff8ec;
    }

    @media (max-width: 860px) {
      body {
        padding: 12px;
      }

      .app {
        grid-template-columns: 1fr;
      }

      .left,
      .output {
        min-height: 0;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="panel left">
      <header>
        <span class="eyebrow">custom diagram DSL</span>
        <h1>TinyFlow</h1>
        <p>Мини-библиотека на JavaScript: простая Mermaid-like разметка превращается в SVG прямо внутри iframe.</p>
      </header>

      <textarea id="source" spellcheck="false">title: Obsidian render path
direction: LR
skin: warm

A[start: User asks]
B[process: TinyFlow DSL]
C{Can Obsidian run JS?}
D[risk: Not inside note]
E[data: iframe HTML]
F[success: SVG diagram]
G((Demo ready))

A -> B: write
B -> C: parse
C -> D: direct note
C -> E: safe path
E -> F: render
F -> G</textarea>

      <div class="actions">
        <button id="render">Render</button>
        <button class="secondary" id="sample">Load sample</button>
      </div>
    </section>

    <section class="panel output" id="output"></section>
  </main>

  <script src="./tinyflow.js"></script>
  <script>
    const examples = [
      `title: Skill decision
direction: TB
skin: warm

A[start: Raw idea]
B[process: Prototype in lab]
C{Useful?}
D[success: Add to skill]
E[note: Keep as experiment]
F((Done))

A -> B
B -> C
C -> D: yes
C -> E: not yet
D -> F
E -> F`,
      `title: Custom card map
direction: LR
skin: ink

A[start: Markdown]
B[data: DSL block]
C[process: Parser]
D[process: Layout]
E[success: SVG]

A -> B
B -> C
C -> D
D -> E`,
    ];

    const source = document.querySelector("#source");
    const output = document.querySelector("#output");
    const renderButton = document.querySelector("#render");
    const sampleButton = document.querySelector("#sample");
    let sampleIndex = 0;

    function render() {
      try {
        output.innerHTML = window.TinyFlow.render(source.value);
      } catch (error) {
        output.innerHTML = `<div class="error">${error.message}</div>`;
      }
    }

    renderButton.addEventListener("click", render);
    source.addEventListener("input", render);
    sampleButton.addEventListener("click", () => {
      source.value = examples[sampleIndex % examples.length];
      sampleIndex += 1;
      render();
    });

    render();
  </script>
</body>
</html>
