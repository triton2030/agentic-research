<svg viewBox="0 0 960 420" role="img" aria-label="SVG file embed proof for Obsidian" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff8ec"/>
      <stop offset=".55" stop-color="#eef6f1"/>
      <stop offset="1" stop-color="#f8eef2"/>
    </linearGradient>
    <linearGradient id="route" x1="120" y1="250" x2="840" y2="145" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c28a34"/>
      <stop offset=".52" stop-color="#52766d"/>
      <stop offset="1" stop-color="#9b6375"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#34413f" flood-opacity=".18"/>
    </filter>
  </defs>

  <rect width="960" height="420" rx="28" fill="url(#bg)"/>
  <path d="M95 250 C220 110 365 330 490 210 S710 78 850 178" fill="none" stroke="url(#route)" stroke-width="10" stroke-linecap="round"/>
  <path d="M95 250 C220 110 365 330 490 210 S710 78 850 178" fill="none" stroke="#fffdf7" stroke-width="3" stroke-linecap="round" opacity=".82"/>

  <g filter="url(#soft-shadow)" font-family="Inter, Arial, sans-serif">
    <g transform="translate(76 126)">
      <rect width="208" height="132" rx="18" fill="#fff8e8" stroke="#c28a34" stroke-width="3"/>
      <circle cx="50" cy="54" r="24" fill="#c28a34"/>
      <text x="50" y="62" text-anchor="middle" font-size="24" font-weight="800" fill="#fffdf7">1</text>
      <text x="104" y="108" text-anchor="middle" font-size="25" font-weight="800" fill="#30281d">Markdown</text>
    </g>

    <g transform="translate(376 96)">
      <rect width="208" height="156" rx="18" fill="#e7f5ef" stroke="#52766d" stroke-width="3"/>
      <circle cx="104" cy="58" r="24" fill="#52766d"/>
      <text x="104" y="66" text-anchor="middle" font-size="24" font-weight="800" fill="#fffdf7">2</text>
      <text x="104" y="128" text-anchor="middle" font-size="25" font-weight="800" fill="#243f39">SVG file</text>
    </g>

    <g transform="translate(676 138)">
      <rect width="208" height="132" rx="18" fill="#f8edf1" stroke="#9b6375" stroke-width="3"/>
      <circle cx="158" cy="52" r="24" fill="#9b6375"/>
      <text x="158" y="60" text-anchor="middle" font-size="24" font-weight="800" fill="#fffdf7">3</text>
      <text x="104" y="108" text-anchor="middle" font-size="25" font-weight="800" fill="#4d2935">Obsidian</text>
    </g>
  </g>

  <g font-family="Inter, Arial, sans-serif" text-anchor="middle">
    <text x="480" y="54" font-size="32" font-weight="850" fill="#242a2f">Beautiful SVG, Tiny Markdown</text>
    <text x="480" y="360" font-size="20" font-weight="700" fill="#52605c">The note embeds this asset with one short wikilink.</text>
  </g>
