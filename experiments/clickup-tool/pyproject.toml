[project]
name = "clickup-control"
version = "0.1.0"
description = "Private ClickUp API control plane for Codex and Claude"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["mcp>=1.27,<2"]

[project.scripts]
clickup-control = "clickup_control.cli:main"
clickup-control-mcp = "clickup_control.mcp_server:main"

[dependency-groups]
dev = ["pytest>=8.4,<10", "ruff>=0.12,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clickup_control"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
