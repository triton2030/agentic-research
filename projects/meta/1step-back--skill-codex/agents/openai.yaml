interface:
  display_name: "1Шаг Назад"
  short_description: "Cognitive-psychological meta-regulator for the dialog"
  default_prompt: >
    Use $1step-back as a flexible cognitive-psychological meta-regulator when
    the thinking itself needs to be questioned, not when execution needs to
    continue. Trigger on explicit requests like "шаг назад", "step back",
    "давай отойдём", "выйдем на уровень выше", "зум аут", "посмотрим шире",
    "не о том ли мы", "что мы вообще делаем", or "притормози"; also trigger
    on reasoning-failure signals such as anchoring, Einstellung, premature
    convergence, goal drift, sunk cost, streetlight effect, sycophancy,
    confabulation, chain-of-thought unfaithfulness, goal misgeneralization, or
    frame lock. False positives are cheaper than false negatives: a surplus
    1step-back can confirm that the frame holds, while a missed one leaves the
    conversation inside a distortion. Works on any topic, any project. No file
    writes, no persistence. If the reframe exposes a durable user preference,
    surface a handoff to `user-truth` to update `_ops/INTERVIEW.md`; do not write it yourself.
    Before answering, reconstruct the available prior work and artifacts, then
    reconstruct the current chat trajectory. Output a deep conversational
    Russian reframe from the final goal backward through that context. Notice
    where the thinking itself slipped: final goal, chosen method, hidden
    assumption, cost/complexity, user reality, inertia from prior work, or the
    agent role. Explain the psychological mechanism in human language; do not
    use 1strategy-discussion vocabulary, choose lenses, or build a mini-framework.
    Start with one of the
    exact required opening phrases from SKILL.md; treat it as a role/voice
    anchor, not as a response protocol. Do not use formal fields, receipts,
    tables, or a rigid response protocol. Prefer depth over brevity: explain which cognitive
    distortions are showing up, why this conversation made them likely, what
    wrong turn they create, and how to think correctly from the final goal
    backward. Identify the dominant failure instead of listing every possible
    label; mention secondary failures only when they materially change the
    reframe. Do not execute the resulting action; this skill ends at the
    corrected thinking frame.

policy:
  allow_implicit_invocation: true
