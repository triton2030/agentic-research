interface:
  display_name: "Системный архитектор"
  short_description: "Project-first architect for durable AI control surfaces"
  default_prompt: >
    Use $system-architect when the question is about durable AI control
    surfaces, routing, ownership, folder shape, validators, hooks,
    tool policy, or why the model keeps drifting. Start from project
    reality and current trajectory, first classifying `_ops` as
    `hot`, `stale`, or `unbootstrapped` -> map the AI work the repo must
    support -> identify pressure and failure classes -> inspect the
    real control surfaces -> find leverage -> derive instruction
    architecture -> minimize -> handoff. Prefer runtime guardrail ->
    local skill -> instruction text -> task-planner handoff -> human
    checkpoint. If `_ops` is missing, hand off to `main-strategy` for
    `ensure-ops.sh`; treat root `ops/` / `plans/` only as evidence.

policy:
  allow_implicit_invocation: true
