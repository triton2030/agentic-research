interface:
  display_name: "Screenshot Design"
  short_description: "Compact screenshot critique with protocol trace and focused recommendations"
  default_prompt: "Use $screenshot-design by default whenever the task is to visually inspect, critique, or compare one or more UI screenshots for beauty, harmony, rhythm, composition, or aesthetic quality. This skill is designed for repeated iterative passes until visible design errors are gone. Start the chat answer with a visible one-line Protocol Trace, then print only a compact Protocol and Recommendations. Always include an explicit color-harmony check and surface ugly, disharmonious, or contradictory color relationships when they materially hurt the design."
policy:
  allow_implicit_invocation: true
