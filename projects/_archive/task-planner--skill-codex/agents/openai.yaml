interface:
  display_name: "Task Planner"
  short_description: "Owns task-files inside the active phase folder"
  default_prompt: >
    Use $task-planner to open, update, check, or close a task file at
    `_ops/plans/phase-NN-<slug>/task-MM-<slug>.md` inside the active
    PROJECT-PLAN phase. Invoke very often: task discussion, movement,
    edits, status changes, start/scope change, and again after
    implementation. During discussion, name the existing/planned task and
    whether scope, assumptions, criteria, or verification change. During
    work, actively read task-relevant evidence, then check edits against
    substeps, Must/Must-not, and verification. After implementation,
    update the same task file with completed substeps, evidence,
    verification, and closure. Every task-file line must be a goal,
    action, criterion, evidence, or verification; omit filler. Read
    PROJECT-PLAN and INTERVIEW as upstream. If `_ops` is missing, phase
    folder is missing, or preferences need recording, hand off to
    `main-strategy`. If the task layer is messy or contradictory, call
    subagent `смит`, when available, for plan-critique before changing
    task files; if unavailable, record the blocker instead of faking review.

policy:
  allow_implicit_invocation: true
